name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root and tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Match Make's explicit selection even if the installed default changes.
      GOTOOLCHAIN: go1.26.8
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: go.mod

      - name: Verify toolchain
        run: make toolchain

      - name: Build executable
        run: make build

      - name: Check formatting
        run: make fmt-check

      - name: Run vet
        run: make vet

      - name: Run unit and tooling regression tests
        run: make test

      - name: Run race tests
        run: make test-race

      - name: Run fuzz smoke (explicit skip when no targets exist)
        run: make fuzz-smoke

      - name: Check dependencies
        run: make deps

      - name: Check license inventory
        run: make licenses

  offline:
    name: Offline experiment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Match Make's explicit selection even if the installed default changes.
      GOTOOLCHAIN: go1.26.8
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: go.mod

      - name: Run reviewed offline experiment checks
        run: make experiments

  vuln:
    name: Vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Match Make's explicit selection even if the installed default changes.
      GOTOOLCHAIN: go1.26.8
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: go.mod

      - name: Run govulncheck
        run: make vuln

  checks:
    name: Go checks
    if: ${{ always() }}
    needs: [root, offline, vuln]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ROOT_RESULT: ${{ needs.root.result }}
      OFFLINE_RESULT: ${{ needs.offline.result }}
      VULN_RESULT: ${{ needs.vuln.result }}
    steps:
      - name: Require every required job to succeed
        run: |
          set -eu
          for result in "$ROOT_RESULT" "$OFFLINE_RESULT" "$VULN_RESULT"; do
            if [ "$result" != success ]; then
              echo "required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
