name: Public CI

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'go.work'
      - 'go.work.sum'
      - '**/go.mod'
      - '**/go.sum'
      - '**/go.work'
      - '**/go.work.sum'
      - 'LICENSE'
      - 'docs/DEPENDENCIES.md'
      - 'Makefile'
      - 'scripts/**'
      - 'experiments/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  root:
    name: Root checks (${{ matrix.mode }}, ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - mode: normal
            partition: core
            target: test-core
          - mode: race
            partition: core
            target: test-race-core
          - mode: normal
            partition: fixtures
            target: test-fixtures
          - mode: race
            partition: fixtures
            target: test-race-fixtures
    env:
      # Match Make's explicit selection even if the installed default changes.
      GOTOOLCHAIN: go1.27.3
      GOEXPERIMENT: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: go.mod

      - name: Verify toolchain
        if: ${{ matrix.mode == 'normal' && matrix.partition == 'core' }}
        run: make toolchain

      - name: Build executable
        if: ${{ matrix.mode == 'normal' && matrix.partition == 'core' }}
        run: make build

      - name: Check formatting
        if: ${{ matrix.mode == 'normal' && matrix.partition == 'core' }}
        run: make fmt-check

      - name: Run vet
        if: ${{ matrix.mode == 'normal' && matrix.partition == 'core' }}
        run: make vet

      - name: Run root test partition
        run: make "${{ matrix.target }}"

      - name: Run fuzz smoke (explicit skip when no targets exist)
        if: ${{ matrix.mode == 'normal' && matrix.partition == 'core' }}
        run: make fuzz-smoke

      - name: Check dependencies
        if: ${{ matrix.mode == 'normal' && matrix.partition == 'core' }}
        run: make deps

      - name: Check license inventory
        if: ${{ matrix.mode == 'normal' && matrix.partition == 'core' }}
        run: make licenses

  offline:
    name: Offline experiment checks (${{ matrix.module }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - module: experiments/g01-scaleset
            profile: core
          - module: experiments/g01-scaleset
            profile: jit
          - module: experiments/g02-auth
            profile: all
          - module: experiments/r1-credentials
            profile: all
    env:
      GOTOOLCHAIN: go1.27.3
      GOEXPERIMENT: ""
      OFFLINE_EXPERIMENT_MODULE: ${{ matrix.module }}
      OFFLINE_EXPERIMENT_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: go.mod

      - name: Run reviewed offline experiment checks
        run: make experiments

  vuln:
    name: Vulnerability check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Match Make's explicit selection even if the installed default changes.
      GOTOOLCHAIN: go1.27.3
      GOEXPERIMENT: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
          cache-dependency-path: go.mod

      - name: Run govulncheck
        run: make vuln

  checks:
    name: Go checks
    if: ${{ always() }}
    needs: [root, offline, vuln]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ROOT_RESULT: ${{ needs.root.result }}
      OFFLINE_RESULT: ${{ needs.offline.result }}
      VULN_RESULT: ${{ needs.vuln.result }}
    steps:
      - name: Require every required job to succeed
        run: |
          set -eu
          for result in "$ROOT_RESULT" "$OFFLINE_RESULT" "$VULN_RESULT"; do
            if [ "$result" != success ]; then
              echo "required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
