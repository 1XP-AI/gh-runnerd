name: Public CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # setup-go installs the exact module toolchain; prevent an implicit
      # second selection so the hosted run remains reproducible.
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod

      - name: Verify toolchain
        run: make toolchain

      - name: Check formatting
        run: make fmt-check

      - name: Run vet
        run: make vet

      - name: Run unit tests (compile-only until G04 contracts)
        run: make test

      - name: Run race tests (compile-only until G04 contracts)
        run: make test-race

      - name: Run fuzz smoke (explicit skip when no targets exist)
        run: make fuzz-smoke

      - name: Check dependencies
        run: make deps

      - name: Check license inventory
        run: make licenses

      - name: Run reviewed offline experiment checks
        run: make experiments

      - name: Run govulncheck
        run: make vuln
